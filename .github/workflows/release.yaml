name: Build Release

# 1. 全局权限声明（最高优先级）
permissions:
  contents: write  # 允许读写内容（包括 Release 资产）
  packages: write  # 额外添加，避免潜在权限问题
  actions: read    # 读取其他工作流状态（可选）

on:
  release:
    types: [created]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 2. 单任务权限（覆盖全局，再次强调）
    permissions:
      contents: write
    strategy:
      fail-fast: false  # 确保一个平台失败不影响其他
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            binary: syncbox
            archive: syncbox-linux.tar.gz
          - os: macos-latest
            binary: syncbox
            archive: syncbox-macos.tar.gz
          - os: windows-latest
            binary: syncbox.exe
            archive: syncbox-windows.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Package artifact
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -Command "Compress-Archive -Path ./target/release/${{ matrix.binary }} -DestinationPath ${{ matrix.archive }} -Force"
          else
            tar -czf ${{ matrix.archive }} -C ./target/release ${{ matrix.binary }}
          fi
        shell: bash

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.archive }}
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}