name: Build and Release

# 核心：使用标签触发（绕过Release权限限制）+ 完整权限声明
permissions:
  contents: write  # 允许创建Release和上传资产
  packages: write  # 额外权限，防止遗漏

on:
  push:
    tags:
      - 'v*.*.*'  # 匹配v1.0.0这样的版本标签

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 单个平台失败不影响其他
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: syncbox
            archive: syncbox-linux-x86_64.tar.gz
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: syncbox
            archive: syncbox-macos-x86_64.tar.gz
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: syncbox.exe
            archive: syncbox-windows-x86_64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}  # 显式指定目标平台

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Locate binary
        id: binary-path
        run: |
          # 定位编译后的二进制文件路径
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            echo "path=target/${{ matrix.target }}/release/${{ matrix.binary }}" >> $GITHUB_OUTPUT
          else
            echo "path=target/${{ matrix.target }}/release/${{ matrix.binary }}" >> $GITHUB_OUTPUT
          fi

      - name: Package artifact
        run: |
          # 根据平台打包
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -Command "Compress-Archive -Path ${{ steps.binary-path.outputs.path }} -DestinationPath ${{ matrix.archive }} -Force"
          else
            tar -czf ${{ matrix.archive }} -C $(dirname ${{ steps.binary-path.outputs.path }}) $(basename ${{ steps.binary-path.outputs.path }})
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2  # 使用最新版action
        with:
          files: ${{ matrix.archive }}
          name: Release ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}
            自动构建的预编译二进制文件
            - Linux: syncbox-linux-x86_64.tar.gz
            - macOS: syncbox-macos-x86_64.tar.gz
            - Windows: syncbox-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
