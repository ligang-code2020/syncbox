[package]
name = "syncbox"
version = "0.1.0"
edition = "2024"
authors = ["Li Gang"]
description = "A simple, reliable file sync tool for developers"
license = "MIT"
readme = "README.md"

[[bin]]
name = "syncbox"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.46", features = ["derive"] }
anyhow = "1.0.99"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
toml = "0.9.5"
notify = "8.1.0"
tokio-util = { version = "0.7.16" }
time = "0.3.41"
tracing = "0.1.41"
tracing-subscriber = { version = " 0.3.19", features = ["env-filter", "fmt"] }
thiserror = "2.0.16"
walkdir = "2.5.0"
indicatif = "0.18.0"
blake3 = "1.8.2"
num-format = "0.4.4"
regex = "1.11.2"



# dev-dependencies
[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
